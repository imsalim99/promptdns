name = "promptdns"
main = "worker/index.ts"

# Cloudflare Email Sending (beta): used only by the owner-gated DMARC seed tool.
send_email = [{ name = "SEND_EMAIL" }]
compatibility_date = "2026-10-01"

# Static assets (Astro build output) are served by the asset layer;
# non-asset paths (/api/*) invoke the Worker in worker/index.ts.
[assets]
binding = "ASSETS"
directory = "dist"
not_found_handling = "404-page"

# D1: promptdns-prod for the live Worker.
[[d1_databases]]
binding = "DB"
database_name = "promptdns-prod"
database_id = "8820ce82-1e40-453c-9e90-4617c4a539e7"

# Monitoring engine: re-scan all monitored domains every 6 hours.
[triggers]
crons = ["0 */6 * * *"]
