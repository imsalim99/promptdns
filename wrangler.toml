name = "promptdns"
main = "worker/index.ts"

# Cloudflare Email Sending (beta): used only by the owner-gated DMARC seed tool.
send_email = [{ name = "SEND_EMAIL" }]
compatibility_date = "2026-10-01"

# Static assets (Astro build output) are served by the asset layer; every
# request passes through the Worker first (worker/index.ts) for canonical
# 301 redirects (http -> https, extension-less -> trailing slash) and the
# guaranteed-clean /robots.txt, then falls through to the asset layer.
[assets]
binding = "ASSETS"
directory = "dist"
not_found_handling = "404-page"
run_worker_first = true

# D1: promptdns-prod for the live Worker.
[[d1_databases]]
binding = "DB"
database_name = "promptdns-prod"
database_id = "8820ce82-1e40-453c-9e90-4617c4a539e7"

# Monitoring engine: re-scan all monitored domains every 6 hours.
[triggers]
crons = ["0 */6 * * *"]
